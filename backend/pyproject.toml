[project]
name = "fragrance-recommender"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8"]

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
